name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The suite covers the protocol, layout, colour pipeline and audio
      # analysis -- none of which need GTK, GStreamer, a display or the adapter.
      - run: python -m pip install --upgrade pip numpy pyserial
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

  package:
    name: package builds and installs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: console script is wired up
        run: skydimo --help

  shell:
    name: installer lints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh && bash -n uninstall.sh
      - run: shellcheck -S error install.sh uninstall.sh
